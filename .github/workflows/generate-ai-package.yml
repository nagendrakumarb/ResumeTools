name: Generate portable AI package

on:
  workflow_dispatch:
    inputs:
      request:
        description: Request JSON committed under ai-requests
        required: true
        default: ai-requests/section-classifier.request.json
  schedule:
    - cron: '0 2 * * 0'
  push:
    paths:
      - 'ai-requests/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-package-generation
  cancel-in-progress: false

jobs:
  generate:
    # Install a GitHub self-hosted runner on the computer that runs the local gRPC workers.
    runs-on: [self-hosted, windows, professionalhub-ai]
    env:
      REQUEST_FILE: ${{ inputs.request || 'ai-requests/section-classifier.request.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Generate and validate package through local gRPC worker
        shell: pwsh
        run: >-
          dotnet run --project src/ProfessionalHub.AI.Orchestrator/ProfessionalHub.AI.Orchestrator.csproj
          -c Release -- package --request "$env:REQUEST_FILE" --output "src/App/wwwroot/ai-packages"
      - name: Verify that only reusable packages changed
        shell: pwsh
        run: |
          $unexpected = git status --porcelain | Where-Object { $_ -notmatch 'src/App/wwwroot/ai-packages/' }
          if ($unexpected) { throw "Unexpected files changed: $unexpected" }
          if (-not (git status --porcelain)) { throw "The worker produced no publishable package changes." }
      - name: Commit generated package branch
        id: commit
        shell: pwsh
        run: |
          $branch = "ai-package/$([DateTime]::UtcNow.ToString('yyyyMMdd-HHmmss'))"
          git switch -c $branch
          git config user.name "professionalhub-ai-bot"
          git config user.email "professionalhub-ai-bot@users.noreply.github.com"
          git add src/App/wwwroot/ai-packages
          git commit -m "Update portable AI package"
          git push --set-upstream origin $branch
          "branch=$branch" >> $env:GITHUB_OUTPUT
      - name: Open review pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr create --base main --head "${{ steps.commit.outputs.branch }}"
          --title "Update portable AI package"
          --body "Generated by the local model workers and validated by the AI package pipeline. No user resume data is included."
